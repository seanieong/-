<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月經週期預測與澳門假期月曆</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  html, body { margin: 0; padding: 0; }
  body { background: #f9f5f7; display: flex; flex-direction: column; align-items: stretch; }
  .app { width: 100%; background: #fff; padding: 8px 6px 14px; position: relative; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .top-bar h1 { font-size: 1rem; color: #4a2c3a; margin: 0; flex: 1; text-align: center; }
  .settings-btn {
    background: #fdf3f7; border: 1px solid #e7c6d5; color: #8b5e7b;
    width: 34px; height: 34px; border-radius: 50%; font-size: 1rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .settings-btn:hover { background: #f7e6ef; }
  .top-bar .spacer { width: 34px; flex-shrink: 0; }

  .input-row { background: #fdf3f7; border-radius: 12px; padding: 9px; margin-bottom: 9px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .input-row label { font-size: 0.7rem; color: #8b5e7b; font-weight: 500; display: block; margin-bottom: 2px; }
  .input-row input { width: 100%; padding: 6px 8px; border: 1px solid #e7c6d5; border-radius: 8px; font-size: 0.83rem; outline: none; }
  .input-row input:focus { border-color: #b989a5; }
  .input-row button { grid-column: span 2; background: #b989a5; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
  .input-row button:hover { background: #a0758b; }

  .view-tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 9px; }
  .view-tabs button { background: #fdf3f7; color: #8b5e7b; border: 1px solid #e7c6d5; padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
  .view-tabs button.active { background: #b989a5; color: #fff; border-color: #b989a5; }

  /* ===== 設定面板 ===== */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 300; padding: 16px;
  }
  .settings-overlay.show { display: flex; }
  .settings-panel {
    background: #fff; border-radius: 16px; padding: 18px 20px;
    max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  }
  .settings-panel h2 { font-size: 1rem; color: #4a2c3a; margin: 0 0 12px; text-align: center; }
  .settings-section-title { font-size: 0.8rem; font-weight: 700; color: #8b5e7b; margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .settings-section-title button {
    background: #b989a5; color: #fff; border: none; padding: 4px 10px;
    border-radius: 12px; font-size: 0.7rem; font-weight: 600; cursor: pointer;
  }
  .settings-section-title button:hover { background: #a0758b; }

  .event-list { display: flex; flex-direction: column; gap: 6px; }
  .event-item {
    display: flex; align-items: center; gap: 8px;
    background: #fdf9fb; border-radius: 8px; padding: 6px 8px;
    border: 1px solid #e7d6e0; font-size: 0.74rem;
  }
  .event-color-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1); }
  .event-name { flex: 1; font-weight: 600; color: #4a2c3a; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event-range { color: #8b5e7b; font-size: 0.68rem; white-space: nowrap; }
  .event-actions { display: flex; gap: 2px; }
  .event-actions button {
    background: none; border: none; cursor: pointer; font-size: 0.75rem;
    padding: 3px 5px; border-radius: 4px; color: #8b5e7b;
  }
  .event-actions button:hover { background: #f0e6ec; }
  .event-actions .del:hover { background: #ffebee; color: #c62828; }

  .settings-close {
    margin-top: 16px; width: 100%; background: #f0e6ec; color: #6a4a5a;
    border: none; padding: 9px; border-radius: 8px; font-size: 0.85rem;
    font-weight: 600; cursor: pointer;
  }
  .settings-close:hover { background: #e7d6e0; }

  /* ===== 編輯 Modal ===== */
  .edit-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 400; padding: 16px;
  }
  .edit-overlay.show { display: flex; }
  .edit-modal {
    background: #fff; border-radius: 16px; padding: 18px 20px;
    max-width: 360px; width: 100%; box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  }
  .edit-modal h3 { margin: 0 0 14px; font-size: 0.95rem; color: #4a2c3a; text-align: center; }
  .edit-field { margin-bottom: 10px; }
  .edit-field label { display: block; font-size: 0.72rem; color: #8b5e7b; font-weight: 500; margin-bottom: 3px; }
  .edit-field input[type="text"], .edit-field input[type="number"] {
    width: 100%; padding: 7px 9px; border: 1px solid #e7c6d5; border-radius: 8px;
    font-size: 0.85rem; outline: none;
  }
  .edit-field input:focus { border-color: #b989a5; }
  .edit-field .range-row { display: flex; align-items: center; gap: 6px; }
  .edit-field .range-row input { flex: 1; }
  .edit-field .range-row span { font-size: 0.78rem; color: #8b5e7b; }
  .edit-field input[type="color"] {
    width: 100%; height: 36px; padding: 2px; border: 1px solid #e7c6d5;
    border-radius: 8px; cursor: pointer; background: #fff;
  }
  .edit-buttons { display: flex; gap: 8px; margin-top: 14px; }
  .edit-buttons button {
    flex: 1; padding: 9px; border-radius: 8px; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; border: none;
  }
  .edit-buttons .cancel { background: #f0e6ec; color: #6a4a5a; }
  .edit-buttons .cancel:hover { background: #e7d6e0; }
  .edit-buttons .save { background: #b989a5; color: #fff; }
  .edit-buttons .save:hover { background: #a0758b; }

  /* ===== 月曆 ===== */
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .nav button { background: none; border: 1px solid #e7c6d5; color: #8b5e7b; font-size: 1rem; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
  .nav button:hover { background: #fdf3f7; }
  .nav .title { font-size: 0.9rem; font-weight: 600; color: #4a2c3a; }
  .swipe-area, .year-swipe-area { overflow: hidden; touch-action: pan-y; user-select: none; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.64rem; font-weight: 600; color: #8b5e7b; margin-bottom: 3px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    border-radius: 6px; font-size: 0.72rem; font-weight: 500; background: #fafafa; color: #333;
    position: relative; padding: 2px 1px; text-align: center; overflow: hidden; line-height: 1.1;
    cursor: pointer; transition: transform 0.1s;
  }
  .cell:hover { transform: scale(1.03); z-index: 2; }
  .cell.empty { background: transparent; cursor: default; }
  .cell.empty:hover { transform: none; }
  .cell.today { box-shadow: inset 0 0 0 2px #b989a5; font-weight: 700; }

  /* 底色優先級：月經 > 假期 > 一般；自訂事件用標籤與邊框表達，不覆蓋底色 */
  .cell.menstrual { background: #fce4ec; color: #c2185b; }
  .cell.holiday   { background: #e8f5e9; color: #2e7d32; }
  .cell.menstrual.holiday { background: #fce4ec; color: #c2185b; box-shadow: inset 0 0 0 2px #66bb6a; }
  .cell.has-event { box-shadow: inset 0 0 0 2px #b989a5; }
  .cell.menstrual.has-event { box-shadow: inset 0 0 0 2px #b989a5, inset 0 0 0 4px #f8bbd0; }
  .cell.holiday.has-event   { box-shadow: inset 0 0 0 2px #b989a5, inset 0 0 0 4px #a5d6a7; }
  .cell.menstrual.holiday.has-event { box-shadow: inset 0 0 0 2px #b989a5, inset 0 0 0 4px #66bb6a; }
  .cell.today.has-event { box-shadow: inset 0 0 0 2px #4a2c3a, inset 0 0 0 4px #b989a5; }

  .cell .num { font-size: 0.72rem; font-weight: 700; }
  .cell .tags { display: flex; flex-direction: column; gap: 1px; margin-top: 1px; width: 100%; }
  .cell .tag {
    font-size: 0.42rem; font-weight: 700; display: block;
    padding: 1px 2px; border-radius: 3px; line-height: 1.05;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag-holiday   { background: #a5d6a7; color: #1b5e20; }
  .tag-menstrual { background: #f8bbd0; color: #880e4f; }

  /* ===== 年曆 ===== */
  .year-view { display: none; }
  .year-view.active { display: block; }
  .month-view { display: block; }
  .month-view.hidden { display: none; }
  .year-start-picker { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 8px; font-size: 0.72rem; color: #8b5e7b; flex-wrap: wrap; }
  .year-start-picker label { font-weight: 600; }
  .year-start-picker input { padding: 4px 6px; border: 1px solid #e7c6d5; border-radius: 6px; font-size: 0.78rem; outline: none; background: #fdf9fb; }
  .year-start-picker input:focus { border-color: #b989a5; }
  .year-start-picker button { background: #b989a5; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
  .year-start-picker button:hover { background: #a0758b; }
  .year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 700px) {
    .app { padding: 6px 3px 10px; }
    .year-grid { grid-template-columns: repeat(2, 1fr); gap: 3px; }
    .mini-month { padding: 2px; border-radius: 4px; }
    .mini-title { font-size: 0.54rem; margin-bottom: 0; }
    .mini-weekdays { font-size: 0.36rem; margin-bottom: 0; }
    .mini-days { gap: 0.5px; }
    .mini-day { font-size: 0.4rem; border-radius: 2px; border-width: 0.5px; }
    .mini-day .seg { font-size: 0.36rem; }
  }
  .mini-month { background: #fdf9fb; border-radius: 8px; padding: 6px; }
  .mini-title { font-size: 0.72rem; font-weight: 700; color: #4a2c3a; text-align: center; margin-bottom: 2px; }
  .mini-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.48rem; color: #a08090; font-weight: 600; margin-bottom: 1px; }
  .mini-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .mini-day { aspect-ratio: 1; display: flex; align-items: stretch; justify-content: stretch; font-size: 0.5rem; border-radius: 3px; background: #fff; overflow: hidden; position: relative; border: 1px solid #f0e6ec; }
  .mini-day.empty { background: transparent; border: none; }
  .mini-day .seg { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.48rem; min-width: 0; overflow: hidden; }
  .seg.plain { background: #fff; color: #666; }
  .seg.holiday { background: #e8f5e9; color: #2e7d32; }
  .seg.menstrual { background: #fce4ec; color: #c2185b; }
  .mini-day.today .seg { box-shadow: inset 0 0 0 1.5px #b989a5; }
  .mini-day.today { border-color: #b989a5; }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 10px; font-size: 0.64rem; color: #666; }
  .legend span { display: flex; align-items: center; gap: 3px; }
  .legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

  /* ===== 詳情 Modal ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 18px 20px; max-width: 340px; width: 100%; box-shadow: 0 15px 40px rgba(0,0,0,0.15); text-align: center; animation: pop 0.15s ease-out; }
  @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal .m-date { font-size: 0.85rem; color: #8b5e7b; margin-bottom: 10px; font-weight: 600; }
  .modal .m-list { display: flex; flex-direction: column; gap: 6px; }
  .modal .m-item { padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; word-break: break-word; text-align: left; }
  .modal .m-close { margin-top: 14px; background: #b989a5; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 500; }
  .modal .m-close:hover { background: #a0758b; }
  .hint { text-align:center; font-size:0.64rem; color:#aaa; margin:8px 0 0; }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="spacer"></div>
    <h1>🌸 週期預測與澳門假期月曆</h1>
    <button class="settings-btn" id="settingsBtn" title="設定">⚙️</button>
  </div>

  <div class="input-row">
    <div>
      <label>上次月經第一天</label>
      <input type="date" id="lastPeriod">
    </div>
    <div>
      <label>週期長度（天）</label>
      <input type="number" id="cycleLen" value="27" min="20" max="45">
    </div>
    <button id="calcBtn">預測並更新</button>
  </div>

  <div class="view-tabs">
    <button id="tabMonth" class="active">📅 月曆</button>
    <button id="tabYear">🗓️ 年曆</button>
  </div>

  <div class="month-view" id="monthView">
    <div class="nav">
      <button id="prevBtn">‹</button>
      <span class="title" id="monthTitle"></span>
      <button id="nextBtn">›</button>
    </div>
    <div class="swipe-area" id="swipeArea">
      <div class="weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <p class="hint">💡 左右滑動切換月份，點擊日期查看完整文字</p>
  </div>

  <div class="year-view" id="yearView">
    <div class="nav">
      <button id="prevYearBtn">‹</button>
      <span class="title" id="yearTitle"></span>
      <button id="nextYearBtn">›</button>
    </div>
    <div class="year-start-picker">
      <label>起始月份：</label>
      <input type="month" id="yearStartInput">
      <button id="yearStartBtn">套用</button>
    </div>
    <div class="year-swipe-area" id="yearSwipeArea">
      <div class="year-grid" id="yearGrid"></div>
    </div>
    <p class="hint">💡 左右滑動切換區間，點擊日期查看完整資訊</p>
  </div>

  <div class="legend" id="legend"></div>
</div>

<!-- 設定面板 -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h2>⚙️ 設定</h2>
    <div class="settings-section-title">
      <span>🎨 自訂事件</span>
      <button id="addEventBtn">＋ 新增</button>
    </div>
    <div class="event-list" id="eventList"></div>
    <button class="settings-close" id="settingsClose">關閉</button>
  </div>
</div>

<!-- 事件編輯 Modal -->
<div class="edit-overlay" id="editOverlay">
  <div class="edit-modal">
    <h3 id="editTitle">新增事件</h3>
    <div class="edit-field">
      <label>名稱</label>
      <input type="text" id="editName" maxlength="20" placeholder="例如：排卵日">
    </div>
    <div class="edit-field">
      <label>顯示範圍（月經第幾天）</label>
      <div class="range-row">
        <input type="number" id="editStart" min="1" max="60" placeholder="起">
        <span>～</span>
        <input type="number" id="editEnd" min="1" max="60" placeholder="迄">
      </div>
    </div>
    <div class="edit-field">
      <label>顏色</label>
      <input type="color" id="editColor" value="#6a1b9a">
    </div>
    <div class="edit-buttons">
      <button class="cancel" id="editCancel">取消</button>
      <button class="save" id="editSave">儲存</button>
    </div>
  </div>
</div>

<!-- 詳情 Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="m-date" id="modalDate"></div>
    <div class="m-list" id="modalList"></div>
    <button class="m-close" id="modalClose">關閉</button>
  </div>
</div>

<script>
// ===== 澳門公眾假期（2026-2027，含補假日）=====
const HOLIDAYS = {
  '2026-01-01': '元旦',
  '2026-02-17': '農曆正月初一',
  '2026-02-18': '農曆正月初二',
  '2026-02-19': '農曆正月初三',
  '2026-04-03': '耶穌受難日',
  '2026-04-04': '復活節前日',
  '2026-04-05': '清明節',
  '2026-04-06': '復活節前日的補假',
  '2026-04-07': '清明節的補假',
  '2026-05-01': '勞動節',
  '2026-05-24': '佛誕節',
  '2026-05-25': '佛誕節的補假',
  '2026-06-19': '端午節',
  '2026-09-26': '中秋節翌日',
  '2026-09-28': '中秋節翌日的補假',
  '2026-10-01': '中華人民共和國國慶日',
  '2026-10-02': '中華人民共和國國慶日翌日',
  '2026-10-18': '重陽節',
  '2026-10-19': '重陽節的補假',
  '2026-11-02': '追思節',
  '2026-12-08': '聖母無原罪瞻禮',
  '2026-12-20': '澳門特別行政區成立紀念日',
  '2026-12-21': '澳門特別行政區成立紀念日的補假',
  '2026-12-22': '冬至',
  '2026-12-24': '聖誕節前日',
  '2026-12-25': '聖誕節',
  '2027-01-01': '元旦',
  '2027-02-06': '農曆正月初一',
  '2027-02-07': '農曆正月初二',
  '2027-02-08': '農曆正月初三',
  '2027-02-09': '農曆正月初一的補假',
  '2027-02-10': '農曆正月初二的補假',
  '2027-03-26': '耶穌受難日',
  '2027-03-27': '復活節前日',
  '2027-03-29': '復活節前日的補假',
  '2027-04-05': '清明節',
  '2027-05-01': '勞動節',
  '2027-05-03': '勞動節的補假',
  '2027-05-13': '佛誕節',
  '2027-06-09': '端午節',
  '2027-09-16': '中秋節翌日',
  '2027-10-01': '中華人民共和國國慶日',
  '2027-10-02': '中華人民共和國國慶日翌日',
  '2027-10-04': '國慶日翌日的補假',
  '2027-10-08': '重陽節',
  '2027-11-02': '追思節',
  '2027-12-08': '聖母無原罪瞻禮',
  '2027-12-20': '澳門特別行政區成立紀念日',
  '2027-12-22': '冬至',
  '2027-12-24': '聖誕節前日',
  '2027-12-25': '聖誕節',
  '2027-12-27': '聖誕節的補假'
};

// ===== 預設值 =====
const DEFAULT_LAST_PERIOD = '2026-10-11';
const DEFAULT_CYCLE_LEN = 27;
const PERIOD_LEN = 5;

const DEFAULT_EVENTS = [
  { id: 'ovulation', name: '排卵日', start: 13, end: 13, color: '#6a1b9a' },
  { id: 'ivf',       name: '植入日', start: 18, end: 22, color: '#e65100' },
  { id: 'egg',       name: '取卵日', start: 12, end: 16, color: '#4fc3f7' }
];

// ===== 本地時間解析 =====
function parseLocalDate(str) {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d, 0, 0, 0, 0);
}
function formatInputDate(dateObj) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function pad(n) { return n.toString().padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function daysBetween(a, b) {
  const aMid = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const bMid = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((aMid - bMid) / 86400000);
}

// ===== 儲存設定 =====
const STORAGE_KEY = 'macau_cycle_predictor_v3';

function loadSettings() {
  let data = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  if (!data) {
    return {
      lastPeriod: DEFAULT_LAST_PERIOD,
      cycleLen: DEFAULT_CYCLE_LEN,
      events: JSON.parse(JSON.stringify(DEFAULT_EVENTS))
    };
  }
  return {
    lastPeriod: data.lastPeriod || DEFAULT_LAST_PERIOD,
    cycleLen: (data.cycleLen >= 20 && data.cycleLen <= 45) ? data.cycleLen : DEFAULT_CYCLE_LEN,
    events: Array.isArray(data.events) && data.events.length > 0
      ? data.events
      : JSON.parse(JSON.stringify(DEFAULT_EVENTS))
  };
}

function saveSettings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      lastPeriod: formatInputDate(lastPeriod),
      cycleLen: cycleLen,
      events: events
    }));
  } catch (e) {}
}

// ===== 顏色工具 =====
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return {
    r: parseInt(h.substring(0, 2), 16),
    g: parseInt(h.substring(2, 4), 16),
    b: parseInt(h.substring(4, 6), 16)
  };
}
function lighten(hex, amount) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.round(r + (255 - r) * amount)}, ${Math.round(g + (255 - g) * amount)}, ${Math.round(b + (255 - b) * amount)})`;
}
function darken(hex, amount) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.round(r * (1 - amount))}, ${Math.round(g * (1 - amount))}, ${Math.round(b * (1 - amount))})`;
}

// 動態注入事件樣式
function injectEventStyles() {
  let css = '';
  events.forEach(ev => {
    const tagBg = lighten(ev.color, 0.55);
    const fg = darken(ev.color, 0.35);
    const segBg = lighten(ev.color, 0.75);
    css += `
      .tag-ev-${ev.id} { background: ${tagBg}; color: ${fg}; }
      .seg-ev-${ev.id} { background: ${segBg}; color: ${fg}; }
      .m-item.ev-${ev.id} { background: ${lighten(ev.color, 0.85)}; color: ${fg}; }
    `;
  });
  let styleTag = document.getElementById('dynamicEventStyles');
  if (!styleTag) {
    styleTag = document.createElement('style');
    styleTag.id = 'dynamicEventStyles';
    document.head.appendChild(styleTag);
  }
  styleTag.textContent = css;
}

// ===== 事件配置 UI =====

    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;font-size:0.7rem;color:#aaa;padding:8px;';
    empty.textContent = '尚未配置任何事件';
    eventListEl.appendChild(empty);
    return;
  }
  events.forEach(ev => {
    const item = document.createElement('div');
    item.className = 'event-item';

    const dot = document.createElement('span');
    dot.className = 'event-color-dot';
    dot.style.background = ev.color;
    item.appendChild(dot);

    const name = document.createElement('span');
    name.className = 'event-name';
    name.textContent = ev.name;
    item.appendChild(name);

    const range = document.createElement('span');
    range.className = 'event-range';
    range.textContent = ev.start === ev.end ? `第 ${ev.start} 日` : `第 ${ev.start}～${ev.end} 日`;
    item.appendChild(range);

    const actions = document.createElement('div');
    actions.className = 'event-actions';

    const editBtn = document.createElement('button');
    editBtn.textContent = '✏️';
    editBtn.title = '編輯';
    editBtn.onclick = () => openEditModal(ev.id);
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.textContent = '🗑️';

      if (confirm(`確定刪除「${ev.name}」？`)) {
        events = events.filter(e => e.id !== ev.id);
        saveSettings();
        injectEventStyles();
        renderEventList();
        renderLegend();
        refreshCurrentView();
      }

    item.appendChild(actions);

}

    editTitle.textContent = '編輯事件';
    editName.value = ev.name;
    editStart.value = ev.start;
    editEnd.value = ev.end;
    editColor.value = ev.color;

    editTitle.textContent = '新增事件';
    editName.value = '';
    editStart.value = '';
    editEnd.value = '';
    editColor.value = '#6a1b9a';
  }

}

  editOverlay.classList.remove('show');

}

editSave.onclick = () => {
  const name = editName.value.trim();
  const start = parseInt(editStart.value);
  const end = parseInt(editEnd.value);
  const color = editColor.value;

  if (!name) { alert('請輸入名稱'); return; }
  if (!start || !end || start < 1 || end < 1) { alert('請輸入有效的起始與結束日（≥1）'); return; }
  if (start > end) { alert('起始日不能大於結束日'); return; }

  if (editingId) {
    const ev = events.find(e => e.id === editingId);
    if (ev) {
      ev.name = name;
      ev.start = start;
      ev.end = end;
      ev.color = color;
    }
  } else {
    const id = 'ev' + Date.now() + Math.floor(Math.random() * 1000);
    events.push({ id, name, start, end, color });
  }

  saveSettings();
  injectEventStyles();
  renderEventList();
  renderLegend();
  refreshCurrentView();
  closeEditModal();
};

// ===== 日期判斷 =====
function getDayInCycle(date) {
  const diff = daysBetween(date, lastPeriod);
  if (diff < 0) return -1;
  return (diff % cycleLen) + 1;
}
function isMenstrual(date) {
  const d = getDayInCycle(date);
  return d >= 1 && d <= PERIOD_LEN;
}
function getMatchingEvents(date) {
  const d = getDayInCycle(date);
  if (d < 1) return [];
  return events.filter(ev => d >= ev.start && d <= ev.end);
}

function getDayInfo(dateObj) {
  const key = dateKey(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const holidayName = HOLIDAYS[key];
  const men = isMenstrual(dateObj);
  const matchedEvents = getMatchingEvents(dateObj);
  const cycleDay = getDayInCycle(dateObj);

  const items = [];
  if (holidayName) items.push({ type: 'holiday', text: '🎉 ' + holidayName });
  matchedEvents.forEach(ev => {
    items.push({ type: 'ev-' + ev.id, text: `📌 ${ev.name}（週期第 ${cycleDay} 天）` });
  });
  if (men) items.push({ type: 'menstrual', text: '🩸 月經期（週期第 ' + cycleDay + ' 天）' });

  return { holidayName, men, matchedEvents, items };
}

// ===== 月曆渲染（重點：底色不被事件覆蓋）=====
function renderMonth() {
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  titleEl.textContent = `${viewYear}年 ${monthNames[viewMonth]}`;
  gridEl.innerHTML = '';

  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay = new Date(viewYear, viewMonth + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startWeekday = firstDay.getDay();

  for (let i = 0; i < startWeekday; i++) {
    const e = document.createElement('div');
    e.className = 'cell empty';
    gridEl.appendChild(e);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const dateObj = new Date(viewYear, viewMonth, d);
    const info = getDayInfo(dateObj);

    // 底色優先順序：月經 > 假期 > 一般（互不覆蓋，兩者同時存在時疊加邊框）
    if (info.men && info.holidayName) {
      cell.classList.add('menstrual', 'holiday');
    } else if (info.men) {
      cell.classList.add('menstrual');
    } else if (info.holidayName) {
      cell.classList.add('holiday');
    }

    // 自訂事件：用 has-event 邊框呈現，不覆蓋底色
    if (info.matchedEvents.length > 0) cell.classList.add('has-event');
    if (sameDay(dateObj, today)) cell.classList.add('today');

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d;
    cell.appendChild(num);

    if (info.items.length > 0) {
      const tags = document.createElement('div');
      tags.className = 'tags';

      // 標籤順序：假期 → 自訂事件 → 月經
      if (info.holidayName) {
        const t = document.createElement('span');
        t.className = 'tag tag-holiday';
        t.textContent = info.holidayName;
        tags.appendChild(t);
      }
      info.matchedEvents.forEach(ev => {
        const t = document.createElement('span');
        t.className = 'tag tag-ev-' + ev.id;
        t.textContent = ev.name;
        tags.appendChild(t);
      });
      if (info.men) {
        const t = document.createElement('span');
        t.className = 'tag tag-menstrual';
        t.textContent = '月經';
        tags.appendChild(t);
      }

      cell.appendChild(tags);
      cell.onclick = () => showModal(dateObj, info.items);
    }

    gridEl.appendChild(cell);
  }
}

// ===== 年曆渲染 =====
function buildMiniDay(dateObj, info) {
  const cell = document.createElement('div');
  cell.className = 'mini-day';
  if (sameDay(dateObj, today)) cell.classList.add('today');

  // 年曆：優先級 假期 > 自訂事件 > 月經，最多 3 個色塊
  const segments = [];
  if (info.holidayName) segments.push({ cls: 'holiday', text: '假' });
  info.matchedEvents.forEach(ev => {
    if (segments.length < 3) segments.push({ cls: 'ev-' + ev.id, text: ev.name.charAt(0) });
  });
  if (segments.length === 0 && info.men) segments.push({ cls: 'menstrual', text: '經' });

  if (segments.length === 0) {
    const seg = document.createElement('div');
    seg.className = 'seg plain';
    seg.textContent = dateObj.getDate();
    cell.appendChild(seg);
  } else if (segments.length === 1) {
    const seg = document.createElement('div');
    seg.className = 'seg ' + segments[0].cls;
    seg.textContent = dateObj.getDate();
    cell.appendChild(seg);
  } else {
    segments.forEach(s => {
      const seg = document.createElement('div');
      seg.className = 'seg ' + s.cls;
      seg.textContent = s.text;
      cell.appendChild(seg);
    });
    cell.title = dateObj.getDate() + '日';
  }

  if (info.items.length > 0) {
    cell.style.cursor = 'pointer';
    cell.onclick = () => showModal(dateObj, info.items);
  }
  return cell;
}

function renderYear() {
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const endY = yearStartYear + Math.floor((yearStartMonth + 11) / 12);
  const endM = (yearStartMonth + 11) % 12;
  yearTitleEl.textContent = `${yearStartYear}年${monthNames[yearStartMonth]} ～ ${endY}年${monthNames[endM]}`;
  yearStartInput.value = `${yearStartYear}-${pad(yearStartMonth + 1)}`;

  yearGridEl.innerHTML = '';

  for (let i = 0; i < 12; i++) {
    const m = (yearStartMonth + i) % 12;
    const y = yearStartYear + Math.floor((yearStartMonth + i) / 12);

    const mini = document.createElement('div');
    mini.className = 'mini-month';

    const title = document.createElement('div');
    title.className = 'mini-title';
    title.textContent = `${y}年${monthNames[m]}`;
    mini.appendChild(title);

    const wd = document.createElement('div');
    wd.className = 'mini-weekdays';
    ['日','一','二','三','四','五','六'].forEach(w => {
      const s = document.createElement('span');
      s.textContent = w;
      wd.appendChild(s);
    });
    mini.appendChild(wd);

    const daysWrap = document.createElement('div');
    daysWrap.className = 'mini-days';

    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startWeekday = firstDay.getDay();

    for (let j = 0; j < startWeekday; j++) {
      const e = document.createElement('div');
      e.className = 'mini-day empty';
      daysWrap.appendChild(e);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateObj = new Date(y, m, d);
      const info = getDayInfo(dateObj);
      daysWrap.appendChild(buildMiniDay(dateObj, info));
    }

    mini.appendChild(daysWrap);
    yearGridEl.appendChild(mini);
  }
}

function refreshCurrentView() {
  if (yearView.classList.contains('active')) {
    renderYear();
  } else {
    renderMonth();

}

function switchToMonth() {
  tabMonth.classList.add('active');

prevBtn.onclick = () => {

  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderMonth();

  yearStartMonth -= 12;
  while (yearStartMonth < 0) { yearStartMonth += 12; yearStartYear--; }
  renderYear();
};

  yearStartMonth += 12;
  while (yearStartMonth > 11) { yearStartMonth -= 12; yearStartYear++; }
  renderYear();
};

// ===== 滑動 =====
function bindSwipe(el, onLeft, onRight) {
  let startX = 0, startY = 0, moved = false;
  el.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    moved = false;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) moved = true;
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (!moved) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) onLeft();
      else onRight();
    }
  });
  let mouseDown = false, mouseStartX = 0;
  el.addEventListener('mousedown', (e) => {
    mouseDown = true;
    mouseStartX = e.clientX;
  });
  window.addEventListener('mouseup', (e) => {
    if (!mouseDown) return;
    mouseDown = false;
    const dx = e.clientX - mouseStartX;
    if (Math.abs(dx) > 80) {
      if (dx < 0) onLeft();
      else onRight();
    }
  });
}
bindSwipe(swipeArea, () => nextBtn.click(), () => prevBtn.click());
bindSwipe(yearSwipeArea, () => nextYearBtn.click(), () => prevYearBtn.click());

// ===== 計算 =====
calcBtn.onclick = () => {
  const v = lastPeriodInput.value;
  if (!v) { alert('請選擇上次月經第一天'); return; }
  lastPeriod = parseLocalDate(v);
  const c = parseInt(cycleInput.value);
  cycleLen = (c >= 20 && c <= 45) ? c : DEFAULT_CYCLE_LEN;
  cycleInput.value = cycleLen;

  saveSettings();

  viewYear = lastPeriod.getFullYear();
  viewMonth = lastPeriod.getMonth();
  if (yearView.classList.contains('active')) {
    yearStartYear = viewYear;
    yearStartMonth = 0;
    renderYear();
  } else {
    renderMonth();
  }
};

// ===== 初始化 =====
function init() {
  const settings = loadSettings();
  lastPeriod = parseLocalDate(settings.lastPeriod) || parseLocalDate(DEFAULT_LAST_PERIOD);
  cycleLen = settings.cycleLen;
  events = settings.events;

  lastPeriodInput.value = formatInputDate(lastPeriod);
  cycleInput.value = cycleLen;

  viewYear = lastPeriod.getFullYear();
  viewMonth = lastPeriod.getMonth();
  yearStartYear = viewYear;
  yearStartMonth = 0;
  yearStartInput.value = `${yearStartYear}-01`;

  injectEventStyles();
  renderLegend();
  renderMonth();
}
init();
