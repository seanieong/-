<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月經週期預測與澳門假期月曆</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  body { background: #f9f5f7; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
  .app { max-width: 820px; width: 100%; background: #fff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 20px; }
  h1 { font-size: 1.5rem; color: #4a2c3a; text-align: center; margin: 0 0 16px; }
  .input-row { background: #fdf3f7; border-radius: 14px; padding: 14px; margin-bottom: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .input-row label { font-size: 0.78rem; color: #8b5e7b; font-weight: 500; display: block; margin-bottom: 3px; }
  .input-row input { width: 100%; padding: 8px 10px; border: 1px solid #e7c6d5; border-radius: 8px; font-size: 0.92rem; outline: none; }
  .input-row input:focus { border-color: #b989a5; }
  .input-row button { grid-column: span 2; background: #b989a5; color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
  .input-row button:hover { background: #a0758b; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .nav button { background: none; border: 1px solid #e7c6d5; color: #8b5e7b; font-size: 1.2rem; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
  .nav button:hover { background: #fdf3f7; }
  .nav .title { font-size: 1.1rem; font-weight: 600; color: #4a2c3a; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.72rem; font-weight: 600; color: #8b5e7b; margin-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    border-radius: 8px; font-size: 0.82rem; font-weight: 500; background: #fafafa; color: #333;
    position: relative; padding: 3px 2px; text-align: center; overflow: hidden; line-height: 1.15;
    cursor: pointer; transition: transform 0.1s;
  }
  .cell:hover { transform: scale(1.03); z-index: 2; }
  .cell.empty { background: transparent; cursor: default; }
  .cell.empty:hover { transform: none; }
  .cell.today { box-shadow: inset 0 0 0 2px #b989a5; font-weight: 700; }

  .cell.menstrual { background: #fce4ec; color: #c2185b; }
  .cell.holiday   { background: #e8f5e9; color: #2e7d32; }
  .cell.ovulation { background: #ede7f6; color: #6a1b9a; }
  .cell.ivf       { background: #fff3e0; color: #e65100; }

  .cell.multi { box-shadow: inset 0 0 0 2px #66bb6a; }
  .cell.today.multi { box-shadow: inset 0 0 0 2px #b989a5, inset 0 0 0 4px #66bb6a; }

  .cell .num { font-size: 0.85rem; font-weight: 700; }
  .cell .tags { display: flex; flex-direction: column; gap: 1px; margin-top: 1px; width: 100%; }
  .cell .tag {
    font-size: 0.52rem; font-weight: 700; display: block;
    padding: 1px 2px; border-radius: 3px; line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag-holiday   { background: #a5d6a7; color: #1b5e20; }
  .tag-ovulation { background: #d1c4e9; color: #4a148c; }
  .tag-ivf       { background: #ffcc80; color: #bf360c; }
  .tag-menstrual { background: #f8bbd0; color: #880e4f; }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; font-size: 0.72rem; color: #666; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend i { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  .legend .m   { background: #f8bbd0; }
  .legend .o   { background: #d1c4e9; }
  .legend .ivf { background: #ffcc80; }
  .legend .h   { background: #a5d6a7; }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 20px 22px;
    max-width: 340px; width: 100%; box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    text-align: center; animation: pop 0.15s ease-out;
  }
  @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal .m-date { font-size: 0.85rem; color: #8b5e7b; margin-bottom: 10px; font-weight: 600; }
  .modal .m-list { display: flex; flex-direction: column; gap: 6px; }
  .modal .m-item {
    padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    word-break: break-word; text-align: left;
  }
  .modal .m-item.holiday   { background: #e8f5e9; color: #1b5e20; }
  .modal .m-item.ovulation { background: #ede7f6; color: #4a148c; }
  .modal .m-item.ivf       { background: #fff3e0; color: #bf360c; }
  .modal .m-item.menstrual { background: #fce4ec; color: #880e4f; }
  .modal .m-close {
    margin-top: 14px; background: #b989a5; color: #fff; border: none;
    padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 500;
  }
  .modal .m-close:hover { background: #a0758b; }
</style>
</head>
<body>
<div class="app">
  <h1>🌸 週期預測與澳門假期月曆</h1>

  <div class="input-row">
    <div>
      <label>上次月經第一天</label>
      <input type="date" id="lastPeriod">
    </div>
    <div>
      <label>週期長度（天）</label>
      <input type="number" id="cycleLen" value="27" min="20" max="45">
    </div>
    <button id="calcBtn">預測並更新</button>
  </div>

  <div class="nav">
    <button id="prevBtn">‹</button>
    <span class="title" id="monthTitle"></span>
    <button id="nextBtn">›</button>
  </div>

  <div class="weekdays">
    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="legend">
    <span><i class="m"></i> 月經期</span>
    <span><i class="o"></i> 排卵日</span>
    <span><i class="ivf"></i> IVF 植入日</span>
    <span><i class="h"></i> 公眾假期</span>
  </div>
  <p style="text-align:center;font-size:0.72rem;color:#aaa;margin:10px 0 0;">💡 點擊日期格子可查看完整文字</p>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="m-date" id="modalDate"></div>
    <div class="m-list" id="modalList"></div>
    <button class="m-close" id="modalClose">關閉</button>
  </div>
</div>

<script>
// ===== 澳門公眾假期（2026-2027）=====
const HOLIDAYS = {
  '2026-01-01': '元旦',
  '2026-02-17': '農曆正月初一',
  '2026-02-18': '農曆正月初二',
  '2026-02-19': '農曆正月初三',
  '2026-04-03': '耶穌受難日',
  '2026-04-04': '復活節前日',
  '2026-04-05': '清明節',
  '2026-05-01': '勞動節',
  '2026-05-24': '佛誕節',
  '2026-06-19': '端午節',
  '2026-09-26': '中秋節翌日',
  '2026-10-01': '中華人民共和國國慶日',
  '2026-10-02': '國慶日翌日',
  '2026-10-18': '重陽節',
  '2026-11-02': '追思節',
  '2026-12-08': '聖母無原罪瞻禮',
  '2026-12-20': '澳門特區成立紀念日',
  '2026-12-22': '冬至',
  '2026-12-24': '聖誕節前日',
  '2026-12-25': '聖誕節',
  '2027-01-01': '元旦',
  '2027-02-06': '農曆正月初一',
  '2027-02-07': '農曆正月初二',
  '2027-02-08': '農曆正月初三',
  '2027-03-26': '耶穌受難日',
  '2027-03-27': '復活節前日',
  '2027-04-05': '清明節',
  '2027-05-01': '勞動節',
  '2027-05-13': '佛誕節',
  '2027-06-09': '端午節',
  '2027-09-16': '中秋節翌日',
  '2027-10-01': '中華人民共和國國慶日',
  '2027-10-02': '國慶日翌日',
  '2027-10-08': '重陽節',
  '2027-11-02': '追思節',
  '2027-12-08': '聖母無原罪瞻禮',
  '2027-12-20': '澳門特區成立紀念日',
  '2027-12-22': '冬至',
  '2027-12-24': '聖誕節前日',
  '2027-12-25': '聖誕節'
};

// ===== 預設值 =====
const DEFAULT_LAST_PERIOD = '2026-10-11';
const DEFAULT_CYCLE_LEN = 27;
const PERIOD_LEN = 5;
const IVF_START = 18;
const IVF_END = 22;

// ===== 狀態 =====
const today = new Date();
let viewYear, viewMonth;
let lastPeriod = new Date(DEFAULT_LAST_PERIOD);
let cycleLen = DEFAULT_CYCLE_LEN;

// ===== DOM =====
const gridEl = document.getElementById('grid');
const titleEl = document.getElementById('monthTitle');
const lastPeriodInput = document.getElementById('lastPeriod');
const cycleInput = document.getElementById('cycleLen');
const calcBtn = document.getElementById('calcBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const modalOverlay = document.getElementById('modalOverlay');
const modalDate = document.getElementById('modalDate');
const modalList = document.getElementById('modalList');
const modalClose = document.getElementById('modalClose');

lastPeriodInput.value = DEFAULT_LAST_PERIOD;
cycleInput.value = DEFAULT_CYCLE_LEN;

// ===== 工具 =====
function pad(n) { return n.toString().padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function getDayInCycle(date) {
  const diff = Math.floor((date - lastPeriod) / 86400000);
  if (diff < 0) return -1;
  return (diff % cycleLen) + 1;
}
function isMenstrual(date) {
  const d = getDayInCycle(date);
  return d >= 1 && d <= PERIOD_LEN;
}
function isOvulation(date) {
  const d = getDayInCycle(date);
  return d === (cycleLen - 14);
}
function isIVF(date) {
  const d = getDayInCycle(date);
  return d >= IVF_START && d <= IVF_END;
}

// ===== Modal 顯示 =====
function showModal(dateObj, items) {
  const y = dateObj.getFullYear();
  const m = dateObj.getMonth() + 1;
  const d = dateObj.getDate();
  const weekdays = ['日','一','二','三','四','五','六'];
  const wd = weekdays[dateObj.getDay()];
  modalDate.textContent = `${y}年${m}月${d}日（星期${wd}）`;
  modalList.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'm-item ' + it.type;
    div.textContent = it.text;
    modalList.appendChild(div);
  });
  modalOverlay.classList.add('show');
}

modalClose.onclick = () => modalOverlay.classList.remove('show');
modalOverlay.onclick = (e) => {
  if (e.target === modalOverlay) modalOverlay.classList.remove('show');
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') modalOverlay.classList.remove('show');
});

// ===== 渲染 =====
function render() {
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  titleEl.textContent = `${viewYear}年 ${monthNames[viewMonth]}`;
  gridEl.innerHTML = '';

  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay = new Date(viewYear, viewMonth + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startWeekday = firstDay.getDay();

  for (let i = 0; i < startWeekday; i++) {
    const e = document.createElement('div');
    e.className = 'cell empty';
    gridEl.appendChild(e);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const dateObj = new Date(viewYear, viewMonth, d);
    const key = dateKey(viewYear, viewMonth, d);

    const holidayName = HOLIDAYS[key];
    const men = isMenstrual(dateObj);
    const ovu = isOvulation(dateObj);
    const ivf = isIVF(dateObj);

    // 底色（後加入的優先）
    if (men) cell.classList.add('menstrual');
    if (holidayName) cell.classList.add('holiday');
    if (ovu) cell.classList.add('ovulation');
    if (ivf) cell.classList.add('ivf');

    const specialCount = [holidayName, ovu, ivf].filter(Boolean).length;
    if (specialCount >= 2) cell.classList.add('multi');
    if (sameDay(dateObj, today)) cell.classList.add('today');

    // 日期數字
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d;
    cell.appendChild(num);

    // 收集標籤資料（用於 Modal）
    const items = [];

    if (holidayName) items.push({ type: 'holiday', text: '🎉 ' + holidayName });
    if (ivf) items.push({ type: 'ivf', text: '🧬 IVF 植入日（週期第 ' + getDayInCycle(dateObj) + ' 天）' });
    if (ovu) items.push({ type: 'ovulation', text: '🥚 預測排卵日（週期第 ' + getDayInCycle(dateObj) + ' 天）' });
    if (men) items.push({ type: 'menstrual', text: '🩸 月經期（週期第 ' + getDayInCycle(dateObj) + ' 天）' });

    // 標籤容器
    if (items.length > 0) {
      const tags = document.createElement('div');
      tags.className = 'tags';
      if (holidayName) {
        const t = document.createElement('span');
        t.className = 'tag tag-holiday';
        t.textContent = holidayName;
        tags.appendChild(t);
      }
      if (ivf) {
        const t = document.createElement('span');
        t.className = 'tag tag-ivf';
        t.textContent = '植入日';
        tags.appendChild(t);
      }
      if (ovu) {
        const t = document.createElement('span');
        t.className = 'tag tag-ovulation';
        t.textContent = '排卵日';
        tags.appendChild(t);
      }
      if (men) {
        const t = document.createElement('span');
        t.className = 'tag tag-menstrual';
        t.textContent = '月經';
        tags.appendChild(t);
      }
      cell.appendChild(tags);

      // 點擊顯示完整資訊
      cell.onclick = () => showModal(dateObj, items);
    }

    gridEl.appendChild(cell);
  }
}

// ===== 事件 =====
prevBtn.onclick = () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
};
nextBtn.onclick = () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
};
calcBtn.onclick = () => {
  const v = lastPeriodInput.value;
  if (!v) { alert('請選擇上次月經第一天'); return; }
  lastPeriod = new Date(v);
  const c = parseInt(cycleInput.value);
  cycleLen = (c >= 20 && c <= 45) ? c : DEFAULT_CYCLE_LEN;
  cycleInput.value = cycleLen;
  viewYear = lastPeriod.getFullYear();
  viewMonth = lastPeriod.getMonth();
  render();
};

// 初始化
viewYear = lastPeriod.getFullYear();
viewMonth = lastPeriod.getMonth();
render();
</script>
</body>
</html>
