<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月經週期預測與澳門假期月曆</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  html, body { margin: 0; padding: 0; }
  body { background: #f9f5f7; display: flex; flex-direction: column; align-items: stretch; }
  .app { width: 100%; background: #fff; padding: 8px 6px 14px; }

  h1 { font-size: 1.05rem; color: #4a2c3a; text-align: center; margin: 0 0 8px; }

  .input-row { background: #fdf3f7; border-radius: 12px; padding: 9px; margin-bottom: 9px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .input-row label { font-size: 0.7rem; color: #8b5e7b; font-weight: 500; display: block; margin-bottom: 2px; }
  .input-row input { width: 100%; padding: 6px 8px; border: 1px solid #e7c6d5; border-radius: 8px; font-size: 0.83rem; outline: none; }
  .input-row input:focus { border-color: #b989a5; }
  .input-row button { grid-column: span 2; background: #b989a5; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
  .input-row button:hover { background: #a0758b; }

  /* ===== 檢視切換 ===== */
  .view-tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 9px; }
  .view-tabs button {
    background: #fdf3f7; color: #8b5e7b; border: 1px solid #e7c6d5;
    padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
  }
  .view-tabs button.active { background: #b989a5; color: #fff; border-color: #b989a5; }

  /* ===== 月曆 ===== */
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .nav button { background: none; border: 1px solid #e7c6d5; color: #8b5e7b; font-size: 1rem; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
  .nav button:hover { background: #fdf3f7; }
  .nav .title { font-size: 0.9rem; font-weight: 600; color: #4a2c3a; }

  .swipe-area { overflow: hidden; touch-action: pan-y; user-select: none; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.64rem; font-weight: 600; color: #8b5e7b; margin-bottom: 3px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    border-radius: 6px; font-size: 0.72rem; font-weight: 500; background: #fafafa; color: #333;
    position: relative; padding: 2px 1px; text-align: center; overflow: hidden; line-height: 1.1;
    cursor: pointer; transition: transform 0.1s;
  }
  .cell:hover { transform: scale(1.03); z-index: 2; }
  .cell.empty { background: transparent; cursor: default; }
  .cell.empty:hover { transform: none; }
  .cell.today { box-shadow: inset 0 0 0 2px #b989a5; font-weight: 700; }

  .cell.menstrual { background: #fce4ec; color: #c2185b; }
  .cell.holiday   { background: #e8f5e9; color: #2e7d32; }
  .cell.ovulation { background: #ede7f6; color: #6a1b9a; }
  .cell.ivf       { background: #fff3e0; color: #e65100; }

  .cell.multi { box-shadow: inset 0 0 0 2px #66bb6a; }
  .cell.today.multi { box-shadow: inset 0 0 0 2px #b989a5, inset 0 0 0 4px #66bb6a; }

  .cell .num { font-size: 0.72rem; font-weight: 700; }
  .cell .tags { display: flex; flex-direction: column; gap: 1px; margin-top: 1px; width: 100%; }
  .cell .tag {
    font-size: 0.42rem; font-weight: 700; display: block;
    padding: 1px 2px; border-radius: 3px; line-height: 1.05;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag-holiday   { background: #a5d6a7; color: #1b5e20; }
  .tag-ovulation { background: #d1c4e9; color: #4a148c; }
  .tag-ivf       { background: #ffcc80; color: #bf360c; }
  .tag-menstrual { background: #f8bbd0; color: #880e4f; }

  /* ===== 年曆 ===== */
  .year-view { display: none; }
  .year-view.active { display: block; }
  .month-view { display: block; }
  .month-view.hidden { display: none; }

  /* 起始月份選擇器 */
  .year-start-picker {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 8px; font-size: 0.72rem; color: #8b5e7b; flex-wrap: wrap;
  }
  .year-start-picker label { font-weight: 600; }
  .year-start-picker input {
    padding: 4px 6px; border: 1px solid #e7c6d5; border-radius: 6px;
    font-size: 0.78rem; outline: none; background: #fdf9fb;
  }
  .year-start-picker input:focus { border-color: #b989a5; }
  .year-start-picker button {
    background: #b989a5; color: #fff; border: none; padding: 4px 10px;
    border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
  }
  .year-start-picker button:hover { background: #a0758b; }

  .year-swipe-area { overflow: hidden; touch-action: pan-y; user-select: none; }

  /* 桌面：一行三個月 */
  .year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* 手機：一行兩個月，盡量縮小 */
  @media (max-width: 700px) {
    .app { padding: 6px 3px 10px; }
    .year-grid { grid-template-columns: repeat(2, 1fr); gap: 3px; }
    .mini-month { padding: 2px; border-radius: 4px; }
    .mini-title { font-size: 0.54rem; margin-bottom: 0; }
    .mini-weekdays { font-size: 0.36rem; margin-bottom: 0; }
    .mini-days { gap: 0.5px; }
    .mini-day { font-size: 0.4rem; border-radius: 2px; border-width: 0.5px; }
    .mini-day .seg { font-size: 0.36rem; }
  }

  .mini-month { background: #fdf9fb; border-radius: 8px; padding: 6px; }
  .mini-title { font-size: 0.72rem; font-weight: 700; color: #4a2c3a; text-align: center; margin-bottom: 2px; }
  .mini-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.48rem; color: #a08090; font-weight: 600; margin-bottom: 1px; }
  .mini-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }

  /* 年曆日期格：flex 平均分配多色塊 */
  .mini-day {
    aspect-ratio: 1; display: flex; align-items: stretch; justify-content: stretch;
    font-size: 0.5rem; border-radius: 3px; background: #fff; overflow: hidden;
    position: relative; border: 1px solid #f0e6ec;
  }
  .mini-day.empty { background: transparent; border: none; }
  .mini-day .seg {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-weight: 600; color: #555; font-size: 0.48rem;
    min-width: 0; overflow: hidden;
  }
  .seg.holiday   { background: #e8f5e9; color: #2e7d32; }
  .seg.ivf       { background: #fff3e0; color: #e65100; }
  .seg.ovulation { background: #ede7f6; color: #6a1b9a; }
  .seg.menstrual { background: #fce4ec; color: #c2185b; }
  .seg.plain     { background: #fff; color: #666; }
  .mini-day.today .seg { box-shadow: inset 0 0 0 1.5px #b989a5; }
  .mini-day.today { border-color: #b989a5; }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 10px; font-size: 0.64rem; color: #666; }
  .legend span { display: flex; align-items: center; gap: 3px; }
  .legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .legend .m   { background: #f8bbd0; }
  .legend .o   { background: #d1c4e9; }
  .legend .ivf { background: #ffcc80; }
  .legend .h   { background: #a5d6a7; }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 18px 20px;
    max-width: 340px; width: 100%; box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    text-align: center; animation: pop 0.15s ease-out;
  }
  @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal .m-date { font-size: 0.85rem; color: #8b5e7b; margin-bottom: 10px; font-weight: 600; }
  .modal .m-list { display: flex; flex-direction: column; gap: 6px; }
  .modal .m-item {
    padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    word-break: break-word; text-align: left;
  }
  .modal .m-item.holiday   { background: #e8f5e9; color: #1b5e20; }
  .modal .m-item.ovulation { background: #ede7f6; color: #4a148c; }
  .modal .m-item.ivf       { background: #fff3e0; color: #bf360c; }
  .modal .m-item.menstrual { background: #fce4ec; color: #880e4f; }
  .modal .m-close {
    margin-top: 14px; background: #b989a5; color: #fff; border: none;
    padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 500;
  }
  .modal .m-close:hover { background: #a0758b; }

  .hint { text-align:center; font-size:0.64rem; color:#aaa; margin:8px 0 0; }
</style>
</head>
<body>
<div class="app">
  <h1>🌸 週期預測與澳門假期月曆</h1>

  <div class="input-row">
    <div>
      <label>上次月經第一天</label>
      <input type="date" id="lastPeriod">
    </div>
    <div>
      <label>週期長度（天）</label>
      <input type="number" id="cycleLen" value="27" min="20" max="45">
    </div>
    <button id="calcBtn">預測並更新</button>
  </div>

  <div class="view-tabs">
    <button id="tabMonth" class="active">📅 月曆</button>
    <button id="tabYear">🗓️ 年曆</button>
  </div>

  <!-- ===== 月曆檢視 ===== -->
  <div class="month-view" id="monthView">
    <div class="nav">
      <button id="prevBtn">‹</button>
      <span class="title" id="monthTitle"></span>
      <button id="nextBtn">›</button>
    </div>

    <div class="swipe-area" id="swipeArea">
      <div class="weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <p class="hint">💡 左右滑動切換月份，點擊日期查看完整文字</p>
  </div>

  <!-- ===== 年曆檢視 ===== -->
  <div class="year-view" id="yearView">
    <div class="nav">
      <button id="prevYearBtn">‹</button>
      <span class="title" id="yearTitle"></span>
      <button id="nextYearBtn">›</button>
    </div>
    <div class="year-start-picker">
      <label>起始月份：</label>
      <input type="month" id="yearStartInput">
      <button id="yearStartBtn">套用</button>
    </div>
    <div class="year-swipe-area" id="yearSwipeArea">
      <div class="year-grid" id="yearGrid"></div>
    </div>
    <p class="hint">💡 左右滑動切換區間，點擊日期查看完整資訊（最多 3 色平均分割）</p>
  </div>

  <div class="legend">
    <span><i class="m"></i> 月經期</span>
    <span><i class="o"></i> 排卵日</span>
    <span><i class="ivf"></i> IVF 植入日</span>
    <span><i class="h"></i> 公眾假期</span>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="m-date" id="modalDate"></div>
    <div class="m-list" id="modalList"></div>
    <button class="m-close" id="modalClose">關閉</button>
  </div>
</div>

<script>
// ===== 澳門公眾假期（2026-2027）=====
const HOLIDAYS = {
  '2026-01-01': '元旦',
  '2026-02-17': '農曆正月初一',
  '2026-02-18': '農曆正月初二',
  '2026-02-19': '農曆正月初三',
  '2026-04-03': '耶穌受難日',
  '2026-04-04': '復活節前日',
  '2026-04-05': '清明節',
  '2026-05-01': '勞動節',
  '2026-05-24': '佛誕節',
  '2026-06-19': '端午節',
  '2026-09-26': '中秋節翌日',
  '2026-10-01': '中華人民共和國國慶日',
  '2026-10-02': '國慶日翌日',
  '2026-10-18': '重陽節',
  '2026-11-02': '追思節',
  '2026-12-08': '聖母無原罪瞻禮',
  '2026-12-20': '澳門特區成立紀念日',
  '2026-12-22': '冬至',
  '2026-12-24': '聖誕節前日',
  '2026-12-25': '聖誕節',
  '2027-01-01': '元旦',
  '2027-02-06': '農曆正月初一',
  '2027-02-07': '農曆正月初二',
  '2027-02-08': '農曆正月初三',
  '2027-03-26': '耶穌受難日',
  '2027-03-27': '復活節前日',
  '2027-04-05': '清明節',
  '2027-05-01': '勞動節',
  '2027-05-13': '佛誕節',
  '2027-06-09': '端午節',
  '2027-09-16': '中秋節翌日',
  '2027-10-01': '中華人民共和國國慶日',
  '2027-10-02': '國慶日翌日',
  '2027-10-08': '重陽節',
  '2027-11-02': '追思節',
  '2027-12-08': '聖母無原罪瞻禮',
  '2027-12-20': '澳門特區成立紀念日',
  '2027-12-22': '冬至',
  '2027-12-24': '聖誕節前日',
  '2027-12-25': '聖誕節'
};

// ===== 預設值 =====
const DEFAULT_LAST_PERIOD = '2026-10-11';
const DEFAULT_CYCLE_LEN = 27;
const PERIOD_LEN = 5;
const IVF_START = 18;
const IVF_END = 22;

// ===== 狀態 =====
const today = new Date();
let viewYear, viewMonth;
let yearStartYear, yearStartMonth;   // 年曆起始月份
let lastPeriod = new Date(DEFAULT_LAST_PERIOD);
let cycleLen = DEFAULT_CYCLE_LEN;

// ===== DOM =====
const gridEl = document.getElementById('grid');
const titleEl = document.getElementById('monthTitle');
const yearGridEl = document.getElementById('yearGrid');
const yearTitleEl = document.getElementById('yearTitle');
const yearStartInput = document.getElementById('yearStartInput');
const yearStartBtn = document.getElementById('yearStartBtn');
const lastPeriodInput = document.getElementById('lastPeriod');
const cycleInput = document.getElementById('cycleLen');
const calcBtn = document.getElementById('calcBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const prevYearBtn = document.getElementById('prevYearBtn');
const nextYearBtn = document.getElementById('nextYearBtn');
const tabMonth = document.getElementById('tabMonth');
const tabYear = document.getElementById('tabYear');
const monthView = document.getElementById('monthView');
const yearView = document.getElementById('yearView');
const swipeArea = document.getElementById('swipeArea');
const yearSwipeArea = document.getElementById('yearSwipeArea');
const modalOverlay = document.getElementById('modalOverlay');
const modalDate = document.getElementById('modalDate');
const modalList = document.getElementById('modalList');
const modalClose = document.getElementById('modalClose');

lastPeriodInput.value = DEFAULT_LAST_PERIOD;
cycleInput.value = DEFAULT_CYCLE_LEN;

// ===== 工具 =====
function pad(n) { return n.toString().padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function getDayInCycle(date) {
  const diff = Math.floor((date - lastPeriod) / 86400000);
  if (diff < 0) return -1;
  return (diff % cycleLen) + 1;
}
function isMenstrual(date) {
  const d = getDayInCycle(date);
  return d >= 1 && d <= PERIOD_LEN;
}
function isOvulation(date) {
  const d = getDayInCycle(date);
  return d === (cycleLen - 14);
}
function isIVF(date) {
  const d = getDayInCycle(date);
  return d >= IVF_START && d <= IVF_END;
}

function getDayInfo(dateObj) {
  const key = dateKey(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const holidayName = HOLIDAYS[key];
  const men = isMenstrual(dateObj);
  const ovu = isOvulation(dateObj);
  const ivf = isIVF(dateObj);
  const cycleDay = getDayInCycle(dateObj);

  const items = [];
  if (holidayName) items.push({ type: 'holiday', text: '🎉 ' + holidayName });
  if (ivf) items.push({ type: 'ivf', text: '🧬 IVF 植入日（週期第 ' + cycleDay + ' 天）' });
  if (ovu) items.push({ type: 'ovulation', text: '🥚 預測排卵日（週期第 ' + cycleDay + ' 天）' });
  if (men) items.push({ type: 'menstrual', text: '🩸 月經期（週期第 ' + cycleDay + ' 天）' });

  return { holidayName, men, ovu, ivf, items };
}

// ===== Modal =====
function showModal(dateObj, items) {
  const y = dateObj.getFullYear();
  const m = dateObj.getMonth() + 1;
  const d = dateObj.getDate();
  const weekdays = ['日','一','二','三','四','五','六'];
  const wd = weekdays[dateObj.getDay()];
  modalDate.textContent = `${y}年${m}月${d}日（星期${wd}）`;
  modalList.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'm-item ' + it.type;
    div.textContent = it.text;
    modalList.appendChild(div);
  });
  modalOverlay.classList.add('show');
}
modalClose.onclick = () => modalOverlay.classList.remove('show');
modalOverlay.onclick = (e) => {
  if (e.target === modalOverlay) modalOverlay.classList.remove('show');
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') modalOverlay.classList.remove('show');
});

// ===== 月曆渲染 =====
function renderMonth() {
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  titleEl.textContent = `${viewYear}年 ${monthNames[viewMonth]}`;
  gridEl.innerHTML = '';

  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay = new Date(viewYear, viewMonth + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startWeekday = firstDay.getDay();

  for (let i = 0; i < startWeekday; i++) {
    const e = document.createElement('div');
    e.className = 'cell empty';
    gridEl.appendChild(e);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const dateObj = new Date(viewYear, viewMonth, d);
    const info = getDayInfo(dateObj);

    if (info.men) cell.classList.add('menstrual');
    if (info.holidayName) cell.classList.add('holiday');
    if (info.ovu) cell.classList.add('ovulation');
    if (info.ivf) cell.classList.add('ivf');
    const specialCount = [info.holidayName, info.ovu, info.ivf].filter(Boolean).length;
    if (specialCount >= 2) cell.classList.add('multi');
    if (sameDay(dateObj, today)) cell.classList.add('today');

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d;
    cell.appendChild(num);

    if (info.items.length > 0) {
      const tags = document.createElement('div');
      tags.className = 'tags';
      if (info.holidayName) {
        const t = document.createElement('span');
        t.className = 'tag tag-holiday';
        t.textContent = info.holidayName;
        tags.appendChild(t);
      }
      if (info.ivf) {
        const t = document.createElement('span');
        t.className = 'tag tag-ivf';
        t.textContent = '植入日';
        tags.appendChild(t);
      }
      if (info.ovu) {
        const t = document.createElement('span');
        t.className = 'tag tag-ovulation';
        t.textContent = '排卵日';
        tags.appendChild(t);
      }
      if (info.men) {
        const t = document.createElement('span');
        t.className = 'tag tag-menstrual';
        t.textContent = '月經';
        tags.appendChild(t);
      }
      cell.appendChild(tags);
      cell.onclick = () => showModal(dateObj, info.items);
    }

    gridEl.appendChild(cell);
  }
}

// ===== 年曆渲染 =====
function buildMiniDay(dateObj, info) {
  const cell = document.createElement('div');
  cell.className = 'mini-day';
  if (sameDay(dateObj, today)) cell.classList.add('today');

  const segments = [];
  if (info.holidayName) segments.push({ cls: 'holiday', text: '假' });
  if (info.ivf) segments.push({ cls: 'ivf', text: '植' });
  if (info.ovu) segments.push({ cls: 'ovulation', text: '卵' });
  if (segments.length === 0 && info.men) segments.push({ cls: 'menstrual', text: '經' });

  if (segments.length === 0) {
    const seg = document.createElement('div');
    seg.className = 'seg plain';
    seg.textContent = dateObj.getDate();
    cell.appendChild(seg);
  } else if (segments.length === 1) {
    const seg = document.createElement('div');
    seg.className = 'seg ' + segments[0].cls;
    seg.textContent = dateObj.getDate();
    cell.appendChild(seg);
  } else {
    segments.forEach(s => {
      const seg = document.createElement('div');
      seg.className = 'seg ' + s.cls;
      seg.textContent = s.text;
      cell.appendChild(seg);
    });
    cell.title = dateObj.getDate() + '日';
  }

  if (info.items.length > 0) {
    cell.style.cursor = 'pointer';
    cell.onclick = () => showModal(dateObj, info.items);
  }
  return cell;
}

function renderYear() {
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const endY = yearStartYear + Math.floor((yearStartMonth + 11) / 12);
  const endM = (yearStartMonth + 11) % 12;
  yearTitleEl.textContent = `${yearStartYear}年${monthNames[yearStartMonth]} ～ ${endY}年${monthNames[endM]}`;
  yearStartInput.value = `${yearStartYear}-${pad(yearStartMonth + 1)}`;

  yearGridEl.innerHTML = '';

  for (let i = 0; i < 12; i++) {
    const m = (yearStartMonth + i) % 12;
    const y = yearStartYear + Math.floor((yearStartMonth + i) / 12);

    const mini = document.createElement('div');
    mini.className = 'mini-month';

    const title = document.createElement('div');
    title.className = 'mini-title';
    title.textContent = `${y}年${monthNames[m]}`;
    mini.appendChild(title);

    const wd = document.createElement('div');
    wd.className = 'mini-weekdays';
    ['日','一','二','三','四','五','六'].forEach(w => {
      const s = document.createElement('span');
      s.textContent = w;
      wd.appendChild(s);
    });
    mini.appendChild(wd);

    const daysWrap = document.createElement('div');
    daysWrap.className = 'mini-days';

    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startWeekday = firstDay.getDay();

    for (let j = 0; j < startWeekday; j++) {
      const e = document.createElement('div');
      e.className = 'mini-day empty';
      daysWrap.appendChild(e);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateObj = new Date(y, m, d);
      const info = getDayInfo(dateObj);
      daysWrap.appendChild(buildMiniDay(dateObj, info));
    }

    mini.appendChild(daysWrap);
    yearGridEl.appendChild(mini);
  }
}

// ===== 檢視切換 =====
function switchToMonth() {
  tabMonth.classList.add('active');
  tabYear.classList.remove('active');
  monthView.classList.remove('hidden');
  yearView.classList.remove('active');
  renderMonth();
}
function switchToYear() {
  tabYear.classList.add('active');
  tabMonth.classList.remove('active');
  monthView.classList.add('hidden');
  yearView.classList.add('active');
  // 從當前顯示月份開始
  yearStartYear = viewYear;
  yearStartMonth = viewMonth;
  renderYear();
}
tabMonth.onclick = switchToMonth;
tabYear.onclick = switchToYear;

// ===== 年曆起始月份套用 =====
yearStartBtn.onclick = () => {
  const v = yearStartInput.value;
  if (!v) { alert('請選擇起始月份'); return; }
  const [y, m] = v.split('-').map(Number);
  yearStartYear = y;
  yearStartMonth = m - 1;
  renderYear();
};

// ===== 月曆事件 =====
prevBtn.onclick = () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderMonth();
};
nextBtn.onclick = () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderMonth();
};

// ===== 年曆事件（每次前進 / 後退 12 個月）=====
prevYearBtn.onclick = () => {
  yearStartMonth -= 12;
  while (yearStartMonth < 0) { yearStartMonth += 12; yearStartYear--; }
  renderYear();
};
nextYearBtn.onclick = () => {
  yearStartMonth += 12;
  while (yearStartMonth > 11) { yearStartMonth -= 12; yearStartYear++; }
  renderYear();
};

// ===== 通用滑動綁定 =====
function bindSwipe(el, onLeft, onRight) {
  let startX = 0, startY = 0, moved = false;
  el.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    moved = false;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) moved = true;
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (!moved) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) onLeft();
      else onRight();
    }
  });
  let mouseDown = false, mouseStartX = 0;
  el.addEventListener('mousedown', (e) => {
    mouseDown = true;
    mouseStartX = e.clientX;
  });
  window.addEventListener('mouseup', (e) => {
    if (!mouseDown) return;
    mouseDown = false;
    const dx = e.clientX - mouseStartX;
    if (Math.abs(dx) > 80) {
      if (dx < 0) onLeft();
      else onRight();
    }
  });
}

bindSwipe(swipeArea, () => nextBtn.click(), () => prevBtn.click());
bindSwipe(yearSwipeArea, () => nextYearBtn.click(), () => prevYearBtn.click());

// ===== 計算按鈕 =====
calcBtn.onclick = () => {
  const v = lastPeriodInput.value;
  if (!v) { alert('請選擇上次月經第一天'); return; }
  lastPeriod = new Date(v);
  const c = parseInt(cycleInput.value);
  cycleLen = (c >= 20 && c <= 45) ? c : DEFAULT_CYCLE_LEN;
  cycleInput.value = cycleLen;
  viewYear = lastPeriod.getFullYear();
  viewMonth = lastPeriod.getMonth();
  if (yearView.classList.contains('active')) {
    yearStartYear = viewYear;
    yearStartMonth = viewMonth;
    renderYear();
  } else {
    renderMonth();
  }
};

// ===== 初始化 =====
viewYear = lastPeriod.getFullYear();
viewMonth = lastPeriod.getMonth();
yearStartYear = viewYear;
yearStartMonth = viewMonth;
yearStartInput.value = `${yearStartYear}-${pad(yearStartMonth + 1)}`;
renderMonth();
</script>
